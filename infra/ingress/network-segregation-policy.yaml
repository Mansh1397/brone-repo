apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: witness-hold-queue-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: witness-hold-queue-cache
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic only from authorized verification proxies
    - from:
        - podSelector:
            matchLabels:
              app: verification-relay-proxy
      ports:
        - protocol: TCP
          port: 6379
  egress:
    # Deny all outgoing communication to prevent linkage tracing leaks
    - to: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: active-jury-tracking-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: active-jury-tracking-db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow only verification proxies
    - from:
        - podSelector:
            matchLabels:
              app: verification-relay-proxy
      ports:
        - protocol: TCP
          port: 6380
  egress:
    # Deny all cross-talk to witness cache or nullifier ledger
    - to: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nullifier-reward-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: nullifier-reward-ledger
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow only transactional payout controllers
    - from:
        - podSelector:
            matchLabels:
              app: verification-relay-proxy
      ports:
        - protocol: TCP
          port: 27017
  egress:
    - to: []
