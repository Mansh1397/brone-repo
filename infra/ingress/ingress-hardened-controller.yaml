apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: brone-ingress-hardened
  namespace: default
  annotations:
    # 1. ENFORCE HTTP/3 & TLS 1.3 ONLY
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256"
    nginx.ingress.kubernetes.io/enable-http3: "true"

    # 2. DEEP BUFFER SECURITY COUPLING
    nginx.ingress.kubernetes.io/configuration-snippet: |
      client_header_buffer_size 1k;
      large_client_header_buffers 2 2k;
      client_max_body_size 50k;
      
      # 3. TIMING-ATTACK DEFENSE MAP
      # Pad 403 and 429 response delays to mimic successful app response times (~100ms)
      error_page 403 = @denial_delay;
      error_page 429 = @denial_delay;

    nginx.ingress.kubernetes.io/server-snippet: |
      location @denial_delay {
        # Artificially delay connection resolution to match nominal app execution timing footprints (100ms)
        echo_blocking_sleep 0.1;
        return 403 "Access Denied - Security Restriction Enforced";
      }
spec:
  ingressClassName: nginx
  rules:
    - host: api.brone.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: verification-relay-proxy-service
                port:
                  number: 80
  tls:
    - hosts:
        - api.brone.network
      secretName: brone-tls-cert
