# Anonymize downstream IP addresses at the reverse-proxy edge
map $remote_addr $remote_addr_anonymized {
    # Mask last octet of IPv4 addresses
    ~^(?P<ip>\d+\.\d+\.\d+)\.\d+$                                                     $ip.0;
    # Mask last 80 bits of IPv6 addresses (leaving first 48 bits)
    ~^(?P<ip>[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}):[0-9a-fA-F:]+$       $ip::;
    default                                                                           0.0.0.0;
}

# Mask sensitive headers to prevent forensic leaks
map $http_authorization $auth_header_masked {
    default "[STRIPPED]";
}

map $http_x_brone_blind_signature $sig_header_masked {
    default "[STRIPPED]";
}

# Log format excluding query parameters (using $uri instead of $request_uri)
log_format proxy_secure '$remote_addr_anonymized - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'auth:"$auth_header_masked" sig:"$sig_header_masked"';

access_log /var/log/nginx/access_secure.log proxy_secure;
