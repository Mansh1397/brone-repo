user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Global Rate Limiting Zones (Drop DDoS and heavy burst spikes)
    limit_req_zone $binary_remote_addr zone=api_ip_limit:10m rate=30r/s;
    limit_req_zone $http_x_channel_zone zone=channel_limit:10m rate=100r/s;

    # Geolocated Traffic Steering map (Zones map to specific regional backend upstreams)
    map $http_x_channel_zone $regional_upstream {
        "Gurugram" gurugram_relay_backend;
        "Bengaluru" bengaluru_relay_backend;
        default global_relay_backend;
    }

    # Upstream backend connection pools with active keepalive connections
    upstream gurugram_relay_backend {
        server gurugram-relay-service.local:3000 max_fails=3 fail_timeout=10s;
        server global-relay-service.local:3000 backup; # Fallback cross-region
        keepalive 64;
    }

    upstream bengaluru_relay_backend {
        server bengaluru-relay-service.local:3000 max_fails=3 fail_timeout=10s;
        server global-relay-service.local:3000 backup; # Fallback cross-region
        keepalive 64;
    }

    upstream global_relay_backend {
        server global-relay-service.local:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name api.brone.network;

        # Redirect plain HTTP to HTTPS in production, but expose standard proxy config
        location / {
            # Apply rate limiting matrix
            limit_req zone=api_ip_limit burst=50 nodelay;
            limit_req zone=channel_limit burst=150 nodelay;

            # Routing steering
            proxy_pass http://$regional_upstream;

            # Enable upstream connection pooling (keepalive)
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout configurations
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Dedicated health check proxy path
        location /healthz {
            proxy_pass http://global_relay_backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }
    }
}
