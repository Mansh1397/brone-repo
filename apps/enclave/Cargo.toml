[package]
name = "brone-enclave"
version = "1.0.0"
edition = "2021"
authors = ["brone-deploy <null@brone.network>"]
description = "AWS Nitro Enclave Cryptographic State Machine for Brone Network"

[dependencies]
aws-nitro-enclaves-nsm-api = "0.4"
tokio = { version = "1.35", features = ["full"] }
tokio-vsock = "0.4"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
hpke = "0.10"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
